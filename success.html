<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje enviado | AvantService</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="services.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>var t=localStorage.getItem("avantservice-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");</script>
</head>
<body>

<header>
    <div class="logo-group">
        <img src="logo.svg" width="60px" alt="AvantService">
        <h1>AvantService</h1>
    </div>
    <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
            <span class="icon-moon"><i data-lucide="moon"></i></span>
            <span class="icon-sun"><i data-lucide="sun"></i></span>
        </button>
        <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">
            <span></span><span></span><span></span>
        </button>
    </div>
    <nav id="main-nav">
        <a href="index.html">Inicio</a>
        <a href="index.html#services">Servicios</a>
        <a href="blog.html">Blog</a>
    </nav>
</header>

<main style="display:flex; align-items:center; justify-content:center; min-height: calc(100vh - 130px); padding: 40px 20px;">
    <div style="max-width:480px; width:100%; text-align:center; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:24px; padding:48px 36px;">
        <div class="success-icon" style="margin-bottom:20px;"><i data-lucide="circle-check"></i></div>
        <h1 style="font-size:1.8rem; font-weight:bold; color:#fff; margin-bottom:12px;">¡Mensaje enviado!</h1>
        <p style="color:var(--text-secondary); font-size:1rem; line-height:1.7; margin-bottom:32px;">
            Tu solicitud ha sido recibida correctamente.<br>
            Nos pondremos en contacto contigo en un plazo máximo de <strong style="color:var(--text-primary);">48 horas laborables</strong>.
        </p>
        <a href="index.html" class="cta-button" style="margin-top:0;">Volver al inicio</a>
    </div>
</main>

<footer style="text-align:center; padding: 32px 20px; color: var(--text-secondary); font-size: 0.85rem; border-top: 1px solid var(--glass-border);">
    © 2026 AvantService · Todos los derechos reservados
</footer>

<script src="theme.js"></script>
<script src="nav.js"></script>
<script src="tracker.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
